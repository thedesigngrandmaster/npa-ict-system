<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIMS by Samuel Ikechukwu Amanze</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 min-h-screen">

    <!-- Header -->
    <header class="bg-green-800 text-white">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-7 h-7">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9 17.25v1.007a3 3 0 0 1-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0 1 15 18.257V17.25m6-12V15a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 15V5.25A2.25 2.25 0 0 1 5.25 3h13.5A2.25 2.25 0 0 1 21 5.25Z" />
                </svg>
                <h1 class="text-xl font-bold">Asset Inventory System</h1>
            </div>
            <a href="/dashboard" class="text-sm bg-green-700 hover:bg-green-600 px-4 py-2 rounded-lg transition">←
                Dashboard</a>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-10">

        <!-- Add Asset Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-8">
            <h2 class="text-lg font-semibold text-slate-800 mb-5">Add New Asset</h2>

            <div class="grid md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Asset Tag</label>
                    <input id="assetTag" placeholder="e.g. NPA-L001"
                        class="w-full border border-slate-300 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Asset Name</label>
                    <input id="name" placeholder="e.g. Dell Latitude 5420"
                        class="w-full border border-slate-300 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Category</label>
                    <input id="category" placeholder="Laptop, Printer, Desktop..."
                        class="w-full border border-slate-300 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Location</label>
                    <input id="location" placeholder="e.g. ICT Store, 3rd Floor"
                        class="w-full border border-slate-300 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>
            </div>

            <button onclick="addAsset()"
                class="mt-5 bg-green-600 hover:bg-green-700 text-white font-medium px-6 py-3 rounded-xl transition">
                Add Asset
            </button>
        </div>

        <!-- Assets List -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h2 class="text-lg font-semibold text-slate-800 mb-5">All Assets</h2>
            <div id="list" class="space-y-4"></div>
        </div>

    </main>

    <script>
        async function loadAssets() {
            const res = await fetch('/api/assets');
            const assets = await res.json();
            const list = document.getElementById('list');

            if (assets.length === 0) {
                list.innerHTML = `<p class="text-slate-500 text-center py-8">No assets yet. Add one above.</p>`;
                return;
            }

            list.innerHTML = assets.map(a => `
        <div class="border border-slate-200 rounded-xl p-5 hover:border-green-300 transition">
          <div class="flex justify-between items-start gap-4">
            <div>
              <h3 class="font-semibold text-slate-800">${a.name}</h3>
              <p class="text-sm text-slate-500 mt-1">${a.assetTag}</p>
              <p class="text-sm text-slate-600 mt-1">Category: ${a.category} • Location: ${a.location || 'N/A'}</p>
            </div>
            <span class="text-xs font-medium px-3 py-1 rounded-full whitespace-nowrap ${a.status === 'Available' ? 'bg-green-100 text-green-800' : 'bg-blue-100 text-blue-800'
                }">${a.status}</span>
          </div>
          <div class="mt-4 pt-3 border-t border-slate-100">
            <button onclick="assignAsset(${a.id})" class="bg-slate-800 hover:bg-slate-700 text-white text-sm px-4 py-2 rounded-lg transition">
              Assign Asset
            </button>
          </div>
        </div>
      `).join('');
        }

        async function addAsset() {
            const assetTag = document.getElementById('assetTag').value.trim();
            const name = document.getElementById('name').value.trim();
            if (!assetTag || !name) return alert('Asset Tag and Name are required');

            await fetch('/api/assets', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    assetTag,
                    name,
                    category: document.getElementById('category').value,
                    location: document.getElementById('location').value
                })
            });

            document.getElementById('assetTag').value = '';
            document.getElementById('name').value = '';
            document.getElementById('category').value = '';
            document.getElementById('location').value = '';
            loadAssets();
        }

        async function assignAsset(id) {
            await fetch(`/api/assets/${id}/assign`, { method: 'PATCH' });
            loadAssets();
        }

        loadAssets();
    </script>
</body>

</html>
