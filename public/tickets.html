<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIMS by Samuel Ikechukwu Amanze</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 min-h-screen">

    <!-- Header -->
    <header class="bg-blue-900 text-white">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-7 h-7">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M16.5 6v.75m0 3v.75m0 3v.75m0 3V18m-9-5.25h5.25M7.5 15h3M3.375 5.25c-.621 0-1.125.504-1.125 1.125v3.026a2.999 2.999 0 0 1 0 5.198v3.026c0 .621.504 1.125 1.125 1.125h17.25c.621 0 1.125-.504 1.125-1.125v-3.026a2.999 2.999 0 0 1 0-5.198V6.375c0-.621-.504-1.125-1.125-1.125H3.375Z" />
                </svg>
                <h1 class="text-xl font-bold">Support Ticket System</h1>
            </div>
            <a href="/dashboard" class="text-sm bg-blue-800 hover:bg-blue-700 px-4 py-2 rounded-lg transition">←
                Dashboard</a>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-10">

        <!-- Create Ticket Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-8">
            <h2 class="text-lg font-semibold text-slate-800 mb-5">Create New Ticket</h2>

            <div class="space-y-4">
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Title</label>
                        <input id="title" placeholder="e.g. Printer not working"
                            class="w-full border border-slate-300 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Priority</label>
                        <select id="priority"
                            class="w-full border border-slate-300 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Description</label>
                    <textarea id="description" placeholder="Describe the issue..."
                        class="w-full border border-slate-300 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
                        rows="3"></textarea>
                </div>
            </div>

            <button onclick="createTicket()"
                class="mt-5 bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-3 rounded-xl transition">
                Submit Ticket
            </button>
        </div>

        <!-- Tickets List -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h2 class="text-lg font-semibold text-slate-800 mb-5">All Tickets</h2>
            <div id="list" class="space-y-4"></div>
        </div>

    </main>

    <script>
        async function loadTickets() {
            const res = await fetch('/api/tickets');
            const tickets = await res.json();
            const list = document.getElementById('list');

            if (tickets.length === 0) {
                list.innerHTML = `<p class="text-slate-500 text-center py-8">No tickets yet. Create one above.</p>`;
                return;
            }

            list.innerHTML = tickets.map(t => `
        <div class="border border-slate-200 rounded-xl p-5 hover:border-blue-300 transition">
          <div class="flex justify-between items-start gap-4">
            <div>
              <h3 class="font-semibold text-slate-800">${t.title}</h3>
              <p class="text-sm text-slate-600 mt-1">${t.description || 'No description'}</p>
              <p class="text-xs text-slate-400 mt-2">Priority: ${t.priority} • ID: #${t.id}</p>
            </div>
            <span class="text-xs font-medium px-3 py-1 rounded-full whitespace-nowrap ${t.status === 'Open' ? 'bg-yellow-100 text-yellow-800' :
                    t.status === 'In Progress' ? 'bg-blue-100 text-blue-800' :
                        t.status === 'Resolved' ? 'bg-green-100 text-green-800' :
                            'bg-slate-100 text-slate-600'
                }">${t.status}</span>
          </div>
          <div class="mt-4 pt-3 border-t border-slate-100">
            <select onchange="updateStatus(${t.id}, this.value)" class="border border-slate-300 text-sm p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">Update Status</option>
              <option value="Open">Open</option>
              <option value="In Progress">In Progress</option>
              <option value="Resolved">Resolved</option>
              <option value="Closed">Closed</option>
            </select>
          </div>
        </div>
      `).join('');
        }

        async function createTicket() {
            const title = document.getElementById('title').value.trim();
            if (!title) return alert('Please enter a title');

            await fetch('/api/tickets', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    title,
                    description: document.getElementById('description').value,
                    priority: document.getElementById('priority').value
                })
            });

            document.getElementById('title').value = '';
            document.getElementById('description').value = '';
            loadTickets();
        }

        async function updateStatus(id, status) {
            if (!status) return;
            await fetch(`/api/tickets/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status })
            });
            loadTickets();
        }

        loadTickets();
    </script>
</body>

</html>
